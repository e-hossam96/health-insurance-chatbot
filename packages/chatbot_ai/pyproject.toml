[project]
name = "chatbot-ai"
version = "0.1.0"
description = "AI package for the health insurance chatbot"
authors = [
    { name = "e-hossam96", email = "ehh.hossam@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docling>=2.150.1",
    "fastembed>=0.9.1",
    "langfuse>=5.2.0",
    "openai>=3.51.0",
    "opentelemetry-api>=1.45.2",
    "pydantic-settings>=2.16.3",
    "qdrant-client>=1.20.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
