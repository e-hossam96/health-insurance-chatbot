server {
    listen 80;
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # the backend enforces the exact KB_MAX_UPLOAD_BYTES limit; nginx only caps the request
    client_max_body_size 11m;

    # H6: /metrics is scraped over the internal network only
    location ^~ /api/metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # F15: overwrite, never append, so a client cannot pick its own rate-limit bucket
        proxy_set_header X-Forwarded-For $remote_addr;

        # SSE: disable buffering so tokens stream through
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
