services:
  caddy:
    container_name: health-chatbot-caddy
    image: caddy:2.11.9-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?set LETSENCRYPT_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.31.250.250
    depends_on:
      - frontend
    restart: unless-stopped

  frontend:
    ports: !reset []
    restart: unless-stopped

  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    restart: unless-stopped

  qdrant:
    ports: !reset []
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  prometheus:
    restart: unless-stopped

  grafana:
    restart: unless-stopped

  postgres-exporter:
    restart: unless-stopped
    environment:
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

networks:
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
