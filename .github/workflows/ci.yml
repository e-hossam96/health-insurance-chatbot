name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
          POSTGRES_DB: chatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.20.2
        ports:
          - 6333:6333

    env:
      TEST_POSTGRES_USER: chatbot
      TEST_POSTGRES_PASSWORD: chatbot
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_DB: chatbot_test
      QDRANT_URL: http://localhost:6333

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run checks
        run: make check

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install frontend dependencies and the Playwright browser
        run: cd frontend && npm ci && npx playwright install --with-deps chromium

      - name: Compose smoke test and stack e2e
        run: STACK_E2E=1 bash scripts/smoke_compose.sh
